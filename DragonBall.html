<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragonBallZ</title>
</head>
<body>
<style>
    :root {
        --color-primario: rgba(76, 139, 170);
        --color-secundario: rgba(230, 209, 178);
        --color-terceario: rgba(217, 124, 117);
        --color-cuarto: rgba(44, 102, 131);
        --color-quinto: rgba(187, 166, 133);
    }
    * {
        box-sizing: border-box;
    }
    body {
        background-color: var(--color-primario);
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        margin: 0;
    }
    header {
        padding: 15px;
        display: flex;
        justify-content: space-between; 
        align-items: center;
        background-color: var(--color-secundario);
    }
    .search {
        background-color: var(--color-primario);
        border: 2px solid var(--color-terceario);
        border-radius: 50px;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        font-size: 15px;
        padding: 8px 15px;
        color: var(--color-terceario);
    }
    .search::placeholder {
        color: var(--color-terceario);
    }
    .search:focus {
        outline: none;
        background-color: var(--color-quinto);
    }
    main {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        padding: 20px 0;
    }
    .personaje {
        width: 400px;
        margin: 15px;
        background-color: var(--color-secundario);
        box-shadow: 0 5px 5px black; 
        position: relative;
        overflow: hidden;
        border-radius: 5px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
    }
    .personaje img {
        width: 80%;
        height: 400px;
        object-fit: contain;
        padding: 15px;
    }
    .personaje-info {
        color: var(--color-terceario);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        padding: 15px;
        letter-spacing: 5px;
        width: 100%;
    }
    .personaje-info h3 {
        color: var(--color-terceario);
        margin: 0;
    }
    .personaje-info h1 {
        color: var(--color-primario);
        margin: 0;
    }
    .personaje-info .race {
        font-size: 0.9em;
        color: var(--color-terceario);
    }
    .descripcion {
        background-color: var(--color-quinto);
        padding: 15px;
        position: absolute;
        left: 0;
        bottom: 0;
        right: 0;
        max-height: 100%;
        transform: translateY(101%);
        overflow-y: auto;
        transition: transform 0.3s ease-in;
        color: black;
    }
    .personaje:hover .descripcion {
        transform: translateY(0);
    }
    .overview {
        display: none;
    }
     
</style>

<header>
    <form id="form" style="display: flex; align-items: center; width: 100%; justify-content: space-between;">
        <img src="logo.png" alt="logo" style="width: 100px;">
        <input type="text" id="search" class="search" placeholder="Buscar Personaje">
    </form>
</header>
<main id="main"></main>

<script>
    const API_URL = 'https://dragonball-api.com/api/characters';
    const main = document.getElementById('main');
    const form = document.getElementById('form');
    const search = document.getElementById('search');

    let allCharacters = [];

    getCharacters();

    async function getCharacters(searchName = '') {
        try {
            let url = API_URL;
            if (searchName) {
                url = `${API_URL}?name=${searchName}`;
            }

            const res = await fetch(url);

            if (!res.ok) {
                throw new Error(`Error HTTP: ${res.status}`);
            }

            const data = await res.json();

            const charactersToDisplay = data.items || data;

            if (!searchName) {
                allCharacters = charactersToDisplay;
            }

            showCharacters(charactersToDisplay);

        } catch (error) {
            console.error('Error al obtener los personajes:', error);
            main.innerHTML = '<p>Lo siento, hubo un error al cargar los personajes. Por favor, inténtalo de nuevo más tarde.</p>';
        }
    }

    function showCharacters(characters) {
        main.innerHTML = '';

        if (!characters || characters.length === 0) {
            main.innerHTML = '<p>No se encontraron resultados para tu búsqueda.</p>';
            return;
        }

        characters.forEach((char) => {
            const { id, name, image, ki, maxKi, description, race } = char;

            const charElement = document.createElement('div');
            charElement.classList.add('personaje');
            charElement.innerHTML = `
                <img src="${image}" alt="${name}">
                <div class="personaje-info">
                    <h1>${id}</h1>
                    <h3>${name}</h3>
                    <span class="race">${race ?? 'Desconocida'}</span>
                </div>
                <div class="descripcion">
                    <h3>Descripción:</h3>
                    <p>${description || "Sin descripción disponible."}</p>
                    <p><strong>Ki:</strong> ${ki ?? 'N/A'}</p>
                    <p><strong>Max Ki:</strong> ${maxKi ?? 'N/A'}</p>
                </div>
            `;
            main.appendChild(charElement);
        });
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const searchTerm = search.value.trim();

        if (searchTerm) {
            getCharacters(searchTerm);
            search.value = '';
        } else {
            getCharacters();
        }
    });
</script>

</body>
</html>
