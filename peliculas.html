<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <title>Cartelera de Películas</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(to right, #2a2a2a, #000000);
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border-bottom: 2px solid #ffbf00;
        }

        .search {
            width: 60%;
            max-width: 500px;
            padding: 15px 25px;
            border: 2px solid #ffbf00;
            border-radius: 30px;
            font-size: 18px;
            font-family: 'Roboto', sans-serif;
            background: #333333;
            color: #e0e0e0;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            outline: none;
            transition: all 0.3s ease;
        }

        .search::placeholder {
            color: #aaaaaa;
            font-style: italic;
        }

        .search:focus {
            transform: scale(1.02);
            box-shadow: 0 6px 15px rgba(255, 191, 0, 0.3);
            background-color: #444444;
        }

        main {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 40px;
            gap: 30px;
        }

        .movie {
            background: #222222;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px;
            width: 300px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            border: 1px solid #3a3a3a;
        }

        .movie:hover {
            transform: translateY(-12px);
            box-shadow: 0 15px 35px rgba(255, 191, 0, 0.2), 0 0 20px rgba(255, 191, 0, 0.1);
        }

        .movie img {
            width: 100%;
            height: 450px;
            object-fit: cover;
            display: block;
            border-bottom: 3px solid #ffbf00;
        }

        .movie-info {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #111111;
            border-bottom: 1px solid #333333;
        }

        .movie-info h3 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: #ffbf00;
            font-family: 'Cinzel', serif;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .movie-info span {
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
            font-family: 'Roboto', sans-serif;
            background-color: #444444;
            color: #e0e0e0;
            border: 1px solid #ffbf00;
        }

        .green { background: #28a745; color: #ffffff; border-color: #218838; }
        .orange { background: #fd7e14; color: #ffffff; border-color: #e66a00; }
        .red { background: #dc3545; color: #ffffff; border-color: #c82333; }

        .overview {
            padding: 20px;
            font-size: 15px;
            color: #cccccc;
            font-family: 'Roboto', sans-serif;
            background: #2b2b2b;
            border-top: 1px solid #333333;
            line-height: 1.7;
            max-height: 180px;
            overflow-y: auto;
        }

        .overview h3 {
            margin: 0 0 10px;
            font-size: 18px;
            color: #ffbf00;
            font-weight: 700;
            font-family: 'Cinzel', serif;
        }

        .overview::-webkit-scrollbar {
            width: 8px;
        }

        .overview::-webkit-scrollbar-track {
            background: #333333;
            border-radius: 10px;
        }

        .overview::-webkit-scrollbar-thumb {
            background: #ffbf00;
            border-radius: 10px;
        }

        .movie::before {
            content: '🎬';
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 28px;
            opacity: 0.9;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .search {
                width: 80%;
            }
            main {
                padding: 20px;
                gap: 20px;
            }
            .movie {
                width: 100%;
                max-width: 350px;
            }
            .movie img {
                height: 400px;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 20px 10px;
            }
            .search {
                width: 90%;
                font-size: 16px;
                padding: 12px 20px;
            }
            main {
                padding: 15px;
                gap: 15px;
            }
            .movie {
                margin: 10px;
                width: 100%;
            }
            .movie img {
                height: 350px;
            }
            .movie-info h3 {
                font-size: 18px;
            }
            .movie-info span {
                font-size: 13px;
                padding: 6px 10px;
            }
            .overview {
                font-size: 14px;
                padding: 15px;
            }
            .movie::before {
                font-size: 24px;
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <input type="text" id="search" class="search" placeholder="Buscar películas...">
    </header>
    <main id="main"></main>

    <script>
        const API_URL = "https://api.themoviedb.org/3/discover/movie?sort_by=popularity.desc&api_key=3fd2be6f0c70a2a598f084ddfb75487c&page=1";
        const IMG_PATH = "https://image.tmdb.org/t/p/w500";
        const SEARCH_API = "https://api.themoviedb.org/3/search/movie?api_key=3fd2be6f0c70a2a598f084ddfb75487c&query=";

        const main = document.getElementById("main");
        const search = document.getElementById("search");

        getMovies(API_URL);

        async function getMovies(url) {
            const res = await fetch(url);
            const data = await res.json();
            showMovies(data.results);
        }

        function showMovies(movies) {
            main.innerHTML = "";
            movies.forEach(movie => {
                const { title, poster_path, vote_average, overview } = movie;

                const movieEl = document.createElement("div");
                movieEl.classList.add("movie");

                movieEl.innerHTML = `
                    <img src="${IMG_PATH + poster_path}" alt="${title}">
                    <div class="movie-info">
                        <h3>${title}</h3>
                        <span class="${getClassByRate(vote_average)}">${vote_average.toFixed(1)}</span>
                    </div>
                    <div class="overview">
                        <h3>Sinopsis</h3>
                        ${overview || 'Sinopsis no disponible.'}
                    </div>
                `;
                main.appendChild(movieEl);
            });
        }

        function getClassByRate(vote) {
            if (vote >= 8) return "green";
            else if (vote >= 5) return "orange";
            else return "red";
        }

        search.addEventListener("input", (e) => {
            const searchTerm = e.target.value;
            if (searchTerm && searchTerm !== "") {
                getMovies(SEARCH_API + encodeURIComponent(searchTerm));
            } else {
                getMovies(API_URL);
            }
        });
    </script>
</body>
</html>
